name: CI/CD Pipeline

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: DJANGO_SETTINGS_MODULE=config.settings_ci python manage.py test

      - name: Security check with Bandit
        run: bandit -c bandit.yaml -r .

  docker-security:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t todo_list_api:latest .

      - name: Vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo_list_api:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker-security
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image with version and latest
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/todo_list_api

          # Build com a versão
          docker build -t $IMAGE_NAME:${{ env.VERSION }} .

          # Tag também como latest
          docker tag $IMAGE_NAME:${{ env.VERSION }} $IMAGE_NAME:latest

          # Push das duas tags
          docker push $IMAGE_NAME:${{ env.VERSION }}
          docker push $IMAGE_NAME:latest

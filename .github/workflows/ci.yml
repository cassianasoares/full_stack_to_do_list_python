name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with CI settings
        run: DJANGO_SETTINGS_MODULE=config.settings_ci python manage.py test

      - name: Security check with Bandit
        run: pip install bandit && bandit -r .

  docker-security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t todo_list_api:latest .

      - name: Vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo_list_api:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  deploy:
    runs-on: ubuntu-latest
    needs: docker-security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo_list_api:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo_list_api:latest

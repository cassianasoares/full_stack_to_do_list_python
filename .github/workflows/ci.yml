name: CI/CD Pipeline

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: DJANGO_SETTINGS_MODULE=config.settings_ci python manage.py test

      - name: Security check with Bandit
        run: bandit -c bandit.yaml -r .

  frontend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ── Build & Security Jobs ───────────────────────────────────────────────────
  docker-security:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-verify]
    strategy:
      matrix:
        include:
          - service: backend
            image_tag: todo_list_api:latest
            build_args: backend
          - service: frontend
            image_tag: todo_list_frontend:latest
            build_args: -f frontend/Dockerfile .
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ${{ matrix.image_tag }} ${{ matrix.build_args }}

      - name: Vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ── Deploy Jobs ──────────────────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker-security
    strategy:
      matrix:
        include:
          - service: backend
            image_name: todo_list_api
            build_args: backend
          - service: frontend
            image_name: todo_list_frontend
            build_args: -f frontend/Dockerfile .
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")
          else
            VERSION=$(jq -r .version frontend/package.json)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image with version and latest
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}

          # Build com a versão
          docker build -t $IMAGE_NAME:${{ env.VERSION }} ${{ matrix.build_args }}

          # Tag também como latest
          docker tag $IMAGE_NAME:${{ env.VERSION }} $IMAGE_NAME:latest

          # Push das duas tags
          docker push $IMAGE_NAME:${{ env.VERSION }}
          docker push $IMAGE_NAME:latest
